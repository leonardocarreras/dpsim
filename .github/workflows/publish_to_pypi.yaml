name: Publish to PyPI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  # Release Please dispatches this at the new tag; a tag it pushes starts no run by itself.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version string
        id: get_version
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${REF_NAME#v}"
          else
            BASE="$(git describe --tags --abbrev=0)"
            VERSION="$(echo "${BASE#v}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}').dev${RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Packaging
    needs: [version]
    uses: ./.github/workflows/packaging-python.yaml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
      image: sogno/dpsim:dev

  publish-testpypi:
    name: Publish to Test PyPI
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    needs: [version, build]
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    steps:
    - name: Download wheels from build jobs
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        merge-multiple: true
        path: dist/

    - name: Publish distribution to Test PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.0
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag' && !contains(needs.version.outputs.version, 'rc')
    environment: pypi
    permissions:
      id-token: write
    needs: [version, build]

    steps:
    - name: Download wheels from build jobs
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        merge-multiple: true
        path: dist/

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.0
